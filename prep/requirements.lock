# prep/requirements.lock —— 侧车 venv 的完整精确版本快照 (2026-11-15 由 `pip freeze` 生成)
#
# 用途: 换机器 / venv 损坏后能装回同一套版本, 以及让 PyInstaller 打出的侧车不取决于
# "当时碰巧装了什么"。安装: `pip install -r prep/requirements.lock`(见 prep/setup.ps1)。
# 校验: scripts/check_venv_lock.py 比对当前 venv 与本文件, 接入 check.ps1 (不一致即门禁失败)。
#
# 已知需要人工注意的几行 (没法写成纯 PyPI 精确版本):
#   torch==2.6.0+cu124      本地版本号, CUDA 12.4 构建。需要 PyTorch 官方索引:
#                           --extra-index-url https://download.pytorch.org/whl/cu124
#   llama_cpp_python==0.3.34  本机装的是带 CUDA 的构建, **来源未能从元数据确认**
#                           (PyPI 上默认是源码包, 需本机编译)。重装前先确认该用哪个 wheel 索引,
#                           否则可能装成 CPU 版 —— 词典/讲解会慢一个数量级。
#   en_core_web_sm          spaCy 模型包, 直接指向 GitHub release 的 wheel (带 sha256)。
#   pytest / pyinstaller    测试与打包用, 不属于运行时, 但一并锁住保证构建可复现。
#
# 更新方式: 在 venv 里改完依赖, 重新 `pip freeze` 覆盖本文件的下面部分, 同步改
# pyproject.toml 的 dependencies, 再跑 scripts\check.ps1。
