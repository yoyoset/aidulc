# prep/pyproject.toml —— 直接依赖固定精确版本 + 锁文件策略 (照抄 comic-gen)
[project]
name = "aidulc-prep"
version = "0.1.0"
description = "aidulc 离线批处理侧车: loader → nlp → llm → tts → align → pack"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest"]
# R3.2 (2026-08-08): 文档解析器 (PyMuPDF)。epub 走原生解析不依赖它; pdf/mobi/azw3/fb2
# 走它兜底。缺失时 pdf.py 懒加载会给人话提示, 前端组件健康页可一键安装。
doc = ["pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
