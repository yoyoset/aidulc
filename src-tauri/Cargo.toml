[package]
name = "aidulc"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
# F19 (2026-08-08): reqwest 此前 default-features=false + 无 TLS feature → https 下载在
# TLS 层必断 (实测)。补 native-tls (Windows 走 schannel) 修复下载链路。
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls"], default-features = false }
win32job = "2.0"
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
rfd = "0.15"
base64 = "0.22"
zip = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = 2
